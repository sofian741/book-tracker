name: Parts inventory validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/parts-inventory]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:ui
      - run: npm run build
