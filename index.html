<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#174c40" />
    <title>دفتر الكتب</title>
  </head>
  <body>
    <div id="app">
      <div
        style="
          max-width: 36rem;
          margin: 3rem auto;
          padding: 1.5rem;
          font-family: sans-serif;
          line-height: 1.9;
        "
      >
        <h1>دفتر الكتب</h1>
        <p>جارٍ فتح التطبيق…</p>
        <div id="boot-help" hidden role="alert">
          <p>
            تعذر تحميل التطبيق. أعد تحميل الصفحة. إذا شغّلت المشروع محليًا،
            استخدم أحد الأوامر التالية بدل تقديم ملفات المصدر مباشرة:
          </p>
          <pre dir="ltr">
npm ci
npm start</pre>
          <p>أو للتطوير:</p>
          <pre dir="ltr">npm run dev -- --port 3000</pre>
        </div>
        <noscript>فعّل JavaScript لفتح دفتر الكتب.</noscript>
      </div>
    </div>
    <script
      type="module"
      src="/src/boot.js"
      onerror="document.getElementById('boot-help').hidden = false"
    ></script>
  </body>
</html>
